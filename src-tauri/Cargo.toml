[package]
name = "awake"
version = "0.1.0"
description = "A minimal, local-first desktop utility for keeping your computer awake and optionally simulating activity during long-running tasks."
authors = ["Muhammad Jawad Hassan"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Muhammad-Jawad-Hassan/AWAKE-DESKTOP"

[lib]
name = "awake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Not panic = "abort": unwinding lets one task die without taking the tray app down.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
