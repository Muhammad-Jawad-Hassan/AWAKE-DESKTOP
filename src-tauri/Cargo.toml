[package]
name = "awake"
version = "0.1.0"
description = "A minimal, local-first desktop utility for keeping your computer awake and optionally simulating activity during long-running tasks."
authors = ["Muhammad Jawad Hassan"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Muhammad-Jawad-Hassan/AWAKE-DESKTOP"

[lib]
name = "awake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# The `objc` crate's `sel_impl!` macro checks a stray `cargo-clippy` cfg it never declares.
unexpected_cfgs = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
enigo = "0.6"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
which = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Not panic = "abort": unwinding lets one task die without taking the tray app down.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
